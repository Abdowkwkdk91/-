<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Nation on Fire - تسجيل الدخول</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.5.0/css/flag-icon.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>

    <style>
        :root {
            --primary-blue: #009edb;
            --deep-navy: #0f172a;
            --light-navy: #1e293b;
            --text-light: #f0f8ff;
            --text-muted: #a0c8e8;
            --border-color: rgba(255, 255, 255, 0.2);
            --gold-accent: #ffd700;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            font-family: 'Cairo', sans-serif;
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            background-color: var(--deep-navy);
            min-height: 100vh;
            color: var(--text-light);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://www.toptal.com/designers/subtlepatterns/uploads/world-map.png') center center/cover, 
                        radial-gradient(circle, rgba(15, 23, 42, 0.6) 0%, rgba(15, 23, 42, 0.9) 70%, #0f172a 100%);
            background-blend-mode: overlay;
            opacity: 0.3;
            z-index: -1;
        }

        .container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 2.5rem;
            width: 90%;
            max-width: 420px;
            color: var(--text-light);
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-family: 'Amiri', serif;
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-light);
            margin-bottom: 1.5rem;
            position: relative;
            padding-bottom: 0.75rem;
            text-shadow: 0 0 10px rgba(0, 158, 219, 0.4);
        }

        h2::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 4rem;
            height: 2px;
            background: var(--primary-blue);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--primary-blue);
        }

        input {
            width: 100%;
            padding: 0.85rem 1rem;
            margin: 0.75rem 0;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-light);
            background-color: rgba(30, 41, 59, 0.5);
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 158, 219, 0.3);
            outline: none;
            background-color: rgba(30, 41, 59, 0.8);
        }

        input::placeholder {
            color: var(--text-muted);
            opacity: 0.8;
        }

        .btn {
            border: none;
            border-radius: 0.5rem;
            padding: 0.85rem 1.5rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
            width: 100%;
            font-size: 1.1rem;
        }

        .btn-primary {
            background: var(--primary-blue);
            color: var(--text-light);
            box-shadow: 0 4px 15px rgba(0, 158, 219, 0.2);
        }

        .btn-primary:hover {
            background: #00bfff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 158, 219, 0.3);
        }
        
        #openCountryModal {
            background: rgba(30, 41, 59, 0.5);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            margin-bottom: 1rem;
            font-weight: 600;
        }
        
        #openCountryModal:hover {
            border-color: var(--primary-blue);
            color: var(--text-light);
        }

        .toggle-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            cursor: pointer;
            color: var(--primary-blue);
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .toggle-link:hover {
            text-decoration: underline;
            color: #00bfff;
        }

        .error {
            color: var(--danger);
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: center;
            font-size: 0.9rem;
            margin-top: 1rem;
            font-weight: 600;
            padding: 0.75rem;
            border-radius: 0.5rem;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--deep-navy);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 2rem;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-light);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            position: relative;
        }

        .modal .close-btn {
            position: absolute;
            top: 1rem;
            right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--text-muted);
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .modal .close-btn:hover {
            color: var(--danger);
            transform: scale(1.1);
        }

        .search-bar {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: var(--light-navy);
        }

        .search-bar input {
            flex: 1; border: none; padding: 0.75rem 1rem; outline: none; font-size: 1rem; background: transparent; margin: 0;
        }

        .search-bar i {
            padding: 0.85rem; background: var(--primary-blue); color: var(--text-light);
        }

        .flag-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 1rem;
            padding-top: 1rem;
        }

        .flag-item {
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            padding: 1rem;
            border-radius: 0.5rem;
            background: var(--light-navy);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .flag-item:hover {
            transform: scale(1.05);
            border-color: var(--primary-blue);
            box-shadow: 0 0 15px rgba(0, 158, 219, 0.3);
        }

        .flag-item.locked {
            background-color: rgba(30, 41, 59, 0.5);
            opacity: 0.5;
            cursor: not-allowed;
            border-color: rgba(239, 68, 68, 0.4);
        }

        .flag-item.locked:hover {
            transform: none;
            box-shadow: none;
            border-color: rgba(239, 68, 68, 0.4);
        }
        
        .flag-item.locked .country-name {
            text-decoration: line-through;
            color: var(--danger);
        }

        .flag-item .country-name {
            font-size: 0.9rem; margin-top: 0.75rem; color: var(--text-light); font-weight: 600;
        }

        .flag-icon { font-size: 3.5rem; }

        .notification {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 1000;
            background: var(--light-navy);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            padding: 1rem 1.5rem;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            transform: translateX(calc(100% + 2rem));
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-light);
            min-width: 280px;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .notification.show { transform: translateX(0); }
        .notification.success { border-left: 4px solid var(--success); }
        .notification.error { border-left: 4px solid var(--danger); }
        .notification.info { border-left: 4px solid var(--primary-blue); }

        #transitionOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(15, 23, 42, 0.8) 0%, #0f172a 100%);
            color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            z-index: 9999;
            opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease-in-out, visibility 0s linear 0.5s;
            padding: 1rem;
        }

        #transitionOverlay.active { opacity: 1; visibility: visible; transition: opacity 0.5s ease-in-out, visibility 0s linear 0s; }
        #transitionOverlay h2 {
            font-family: 'Amiri', serif;
            color: white; font-size: 2.2rem; margin-bottom: 0; padding-bottom: 0;
            animation: textFadeInScale 1.5s ease-out forwards;
            opacity: 0;
        }
        #transitionOverlay h2::after { display: none; }
        
        .loading-spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
            margin-top: 20px;
            opacity: 0;
            animation: fadeIn 1s ease-out 0.5s forwards;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes textFadeInScale {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .container.fade-out { opacity: 0; transition: opacity 0.5s ease-out; }
    </style>
</head>
<body>
    <div class="background-overlay"></div>

    <div id="signup-container" class="container">
        <h2>إنشاء حساب</h2>
        <button id="openCountryModal" class="btn">
            <span id="selectedCountryText">اختر أمتك</span>
            <i class="fas fa-globe" id="selectedFlag"></i>
        </button>
        <input type="email" id="signupEmail" placeholder="البريد الإلكتروني" required>
        <input type="text" id="headName" placeholder="لقب القائد" required>
        <input type="password" id="signupPassword" placeholder="كلمة المرور" required>
        <button id="signupButton" class="btn btn-primary">تأسيس الأمة</button>
        <div class="error" id="signupError" style="display:none;"></div>
        <div class="toggle-link" id="showLoginLink">لديك حساب؟ تسجيل الدخول</div>
    </div>

    <div id="login-container" class="container" style="display:none;">
        <h2>تسجيل الدخول</h2>
        <input type="email" id="loginEmail" placeholder="البريد الإلكتروني" required>
        <input type="password" id="loginPassword" placeholder="كلمة المرور" required>
        <button id="signInButton" class="btn btn-primary">دخول مركز القيادة</button>
        <div class="error" id="loginError" style="display:none;"></div>
        <div class="toggle-link" id="showSignUpLink">تأسيس أمة جديدة</div>
    </div>

    <div id="countryModal" class="modal">
        <div class="modal-content">
            <div class="close-btn" id="closeModalBtn"><i class="fas fa-times-circle"></i></div>
            <h2 style="font-size:2rem;">اختر أمتك</h2>
            <div id="modalError" class="error" style="display:none;"></div>
            <div class="search-bar">
                <i class="fa fa-search"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن دولتك...">
            </div>
            <div class="flag-grid" id="flagGrid"></div>
        </div>
    </div>

    <div id="notification" class="notification">
        <p id="notificationMessage"></p>
    </div>

    <div id="transitionOverlay">
        <h2 id="transitionMessage">يتم تأمين انتقالك إلى مركز القيادة...</h2>
        <div class="loading-spinner"></div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDtj_AsssLYm7ZZpgFeUTqYNCrAUevOprs",
            authDomain: "the-chess-game-54a2c.firebaseapp.com",
            databaseURL: "https://the-chess-game-54a2c-default-rtdb.firebaseio.com",
            projectId: "the-chess-game-54a2c",
            storageBucket: "the-chess-game-54a2c.firebasestorage.app",
            messagingSenderId: "1012470944135",
            appId: "1:1012470944135:web:353bd44c8f5f7d8dcdc322",
            measurementId: "G-CFL72H1T3B"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const rtdb = firebase.database();

        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.replace("story.html");
            }
        });

        function showNotification(message, type) {
            const nDiv = document.getElementById('notification');
            const nMsg = document.getElementById('notificationMessage');
            if (nDiv && nMsg) {
                nDiv.className = 'notification';
                nMsg.textContent = message;
                nDiv.classList.add(type);
                nDiv.classList.add('show');
                setTimeout(() => { nDiv.classList.remove('show'); }, 4000);
            }
        }

        let bassSynth, clickSynth, padSynth;
        async function initializeToneJs() {
            if (typeof Tone === 'undefined') return;
            if (Tone.context.state !== 'running') await Tone.start();
            bassSynth = new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 8, envelope: { attack: 0.001, decay: 0.4, sustain: 0.01, release: 0.8, attackCurve: "exponential" }, oscillator: { type: "sine" } }).toDestination();
            clickSynth = new Tone.NoiseSynth({ noise: { type: "white" }, envelope: { attack: 0.001, decay: 0.1, sustain: 0, release: 0.1 } }).toDestination();
            padSynth = new Tone.PolySynth(Tone.Synth, { oscillator: { type: "triangle" }, envelope: { attack: 1, decay: 2, sustain: 0.1, release: 1 }, volume: -10 }).toDestination();
            padSynth.set({ "detune": -1200 });
        }

        async function initiateTransitionAndRedirect() {
            const transitionOverlay = document.getElementById('transitionOverlay');
            const currentContainer = document.querySelector('.container:not([style*="display: none"])');
            if (currentContainer) currentContainer.classList.add('fade-out');
            setTimeout(async () => {
                transitionOverlay.classList.add('active');
                await initializeToneJs();
                if (typeof Tone !== 'undefined') {
                    bassSynth.triggerAttackRelease("C1", "0.5", Tone.now());
                    padSynth.triggerAttackRelease(["C3", "G3"], "3s", Tone.now() + 0.6);
                }
                setTimeout(() => { window.location.href = "story.html"; }, 3500);
            }, 500);
        }
        
        const countries = [
            {code:"DZ",name:"الجزائر"},{code:"BH",name:"البحرين"},{code:"KM",name:"جزر القمر"},{code:"DJ",name:"جيبوتي"},
            {code:"EG",name:"مصر"},{code:"IQ",name:"العراق"},{code:"JO",name:"الأردن"},{code:"KW",name:"الكويت"},
            {code:"LB",name:"لبنان"},{code:"LY",name:"ليبيا"},{code:"MR",name:"موريتانيا"},{code:"MA",name:"المغرب"},
            {code:"OM",name:"عُمان"},{code:"PS",name:"فلسطين"},{code:"QA",name:"قطر"},{code:"SA",name:"المملكة العربية السعودية"},
            {code:"SO",name:"الصومال"},{code:"SD",name:"السودان"},{code:"SY",name:"سوريا"},{code:"TN",name:"تونس"},
            {code:"AE",name:"الإمارات العربية المتحدة"},{code:"YE",name:"اليمن"}
        ];
        let lockedCountriesData = {};

        document.addEventListener('DOMContentLoaded', async () => {
            const signupContainer = document.getElementById("signup-container");
            const loginContainer = document.getElementById("login-container");
            const openCountryModalBtn = document.getElementById("openCountryModal");
            const selectedCountryTextSpan = document.getElementById("selectedCountryText");
            const selectedFlagIcon = document.getElementById("selectedFlag");
            const signupEmailInput = document.getElementById("signupEmail");
            const headNameInput = document.getElementById("headName");
            const signupPasswordInput = document.getElementById("signupPassword");
            const signupButton = document.getElementById("signupButton");
            const signupErrorDiv = document.getElementById("signupError");
            const showLoginLink = document.getElementById("showLoginLink");
            const loginEmailInput = document.getElementById("loginEmail");
            const loginPasswordInput = document.getElementById("loginPassword");
            const signInButton = document.getElementById("signInButton");
            const loginErrorDiv = document.getElementById("loginError");
            const showSignUpLink = document.getElementById("showSignUpLink");
            const countryModal = document.getElementById("countryModal");
            const closeModalBtn = document.getElementById("closeModalBtn");
            const modalErrorDiv = document.getElementById("modalError");
            const searchInput = document.getElementById("searchInput");
            const flagGrid = document.getElementById("flagGrid");

            await fetchLockedCountries();
            if (localStorage.getItem("hasAccount") === "true") showLogin(); else showSignUp();

            openCountryModalBtn.onclick = openModal;
            closeModalBtn.onclick = closeModal;
            signupButton.onclick = signUp;
            signInButton.onclick = signIn;
            showLoginLink.onclick = showLogin;
            showSignUpLink.onclick = showSignUp;
            searchInput.onkeyup = populateFlagGrid;
            flagGrid.addEventListener('click', handleFlagClick);

            function handleFlagClick(event) {
                const flagItem = event.target.closest('.flag-item');
                if (!flagItem) return;
                
                const isLocked = flagItem.classList.contains('locked');
                const countryName = flagItem.getAttribute('data-name');

                if (isLocked) {
                    modalErrorDiv.textContent = `عذراً، أمة ${countryName} محجوزة بالفعل.`;
                    modalErrorDiv.style.display = 'block';
                } else {
                    const countryCode = flagItem.getAttribute('data-code');
                    selectCountry({ code: countryCode, name: countryName });
                }
            }

            async function fetchLockedCountries() {
                try {
                    const snapshot = await db.collection("lockedCountries").get();
                    lockedCountriesData = {};
                    snapshot.forEach(doc => { lockedCountriesData[doc.id] = true; });
                } catch (e) {
                    showNotification("خطأ في جلب بيانات الدول المحجوزة.", "error");
                }
            }

            function populateFlagGrid() {
                flagGrid.innerHTML = "";
                const searchTerm = searchInput.value.toLowerCase();
                countries
                    .filter(c => c.name.toLowerCase().includes(searchTerm))
                    .forEach(country => {
                        const flagDiv = document.createElement("div");
                        flagDiv.className = "flag-item";
                        flagDiv.setAttribute("data-code", country.code);
                        flagDiv.setAttribute("data-name", country.name);
                        if (lockedCountriesData[country.name]) flagDiv.classList.add("locked");
                        flagDiv.innerHTML = `<span class="flag-icon flag-icon-${country.code.toLowerCase()}"></span><div class="country-name">${country.name}</div>`;
                        flagGrid.appendChild(flagDiv);
                    });
            }

            function openModal() {
                countryModal.style.display = "flex";
                modalErrorDiv.style.display = 'none';
                populateFlagGrid();
            }

            function closeModal() { countryModal.style.display = "none"; }

            function selectCountry(country) {
                selectedCountryTextSpan.innerText = country.name;
                selectedFlagIcon.className = "flag-icon flag-icon-" + country.code.toLowerCase();
                closeModal();
            }

            function showLogin() {
                signupContainer.style.display = "none";
                loginContainer.style.display = "block";
            }

            function showSignUp() {
                loginContainer.style.display = "none";
                signupContainer.style.display = "block";
            }
            
            function displayError(container, message) {
                container.textContent = message;
                container.style.display = 'block';
            }

            async function signUp() {
                const countryName = selectedCountryTextSpan.innerText;
                const email = signupEmailInput.value.trim();
                const headName = headNameInput.value.trim();
                const password = signupPasswordInput.value;
                signupErrorDiv.style.display = 'none';

                if (countryName === "اختر أمتك" || !email || !headName || !password) {
                    return displayError(signupErrorDiv, "الرجاء ملء جميع الحقول واختيار أمة.");
                }
                if (password.length < 6) {
                    return displayError(signupErrorDiv, "يجب أن تكون كلمة المرور 6 أحرف على الأقل.");
                }

                signupButton.disabled = true;
                signupButton.textContent = "جاري التأسيس...";
                
                try {
                    if (lockedCountriesData[countryName]) {
                        throw { message: `عذراً، أمة ${countryName} محجوزة بالفعل.` };
                    }
                    const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                    const user = userCredential.user;
                    await db.collection("users").doc(user.uid).set({ email, headName, country: countryName });
                    await db.collection("lockedCountries").doc(countryName).set({ locked: true, userId: user.uid });
                    await rtdb.ref(`users/${user.uid}`).set({ balance: 100000000, assets: {}, dailyIncome: 0, militaryPower: 0, lastClaimDate: "1970-01-01" });
                    localStorage.setItem("hasAccount", "true");
                    showNotification("تم تأسيس الأمة بنجاح! يتم نقلك الآن...", "success");
                    initiateTransitionAndRedirect();
                } catch (e) {
                    let msg = "حدث خطأ أثناء إنشاء الحساب.";
                    if (e.code === 'auth/email-already-in-use') msg = "البريد الإلكتروني هذا مستخدم بالفعل.";
                    else if (e.code === 'auth/invalid-email') msg = "صيغة البريد الإلكتروني غير صالحة.";
                    else if (e.code === 'auth/weak-password') msg = "كلمة المرور ضعيفة جداً.";
                    else if (e.message) msg = e.message;
                    displayError(signupErrorDiv, msg);
                    signupButton.disabled = false;
                    signupButton.textContent = "تأسيس الأمة";
                }
            }

            async function signIn() {
                const email = loginEmailInput.value.trim();
                const password = loginPasswordInput.value;
                loginErrorDiv.style.display = 'none';

                if (!email || !password) {
                    return displayError(loginErrorDiv, "الرجاء إدخال البريد الإلكتروني وكلمة المرور.");
                }

                signInButton.disabled = true;
                signInButton.textContent = "جاري الدخول...";

                try {
                    await auth.signInWithEmailAndPassword(email, password);
                    localStorage.setItem("hasAccount", "true");
                    showNotification("تم تسجيل الدخول بنجاح! يتم نقلك الآن...", "success");
                    initiateTransitionAndRedirect();
                } catch (e) {
                    let msg = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
                    if (e.code === 'auth/invalid-email') msg = "صيغة البريد الإلكتروني غير صالحة.";
                    displayError(loginErrorDiv, msg);
                    signInButton.disabled = false;
                    signInButton.textContent = "دخول مركز القيادة";
                }
            }
        });
    </script>
</body>
    </html>
