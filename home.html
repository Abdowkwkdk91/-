<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>القيادة العليا - لوحة التحكم</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap');
        :root {
            --background: #0D1117;
            --surface: #161B22;
            --surface-gradient: linear-gradient(145deg, #1A2029, #12171E);
            --primary: #58A6FF;
            --primary-light: rgba(88, 166, 255, 0.1);
            --border: #30363D;
            --text-primary: #C9D1D9;
            --text-secondary: #8B949E;
            --success: #3FB950;
            --danger: #F85149;
            --warning: #D29922;
        }
        * {
            font-family: 'Almarai', sans-serif;
            box-sizing: border-box;
        }
        body {
            background-color: var(--background);
            color: var(--text-primary);
        }
        #main-content {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            overflow-y: auto;
        }
        .profile-card {
            background: var(--surface-gradient);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .profile-card h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }
        .profile-card p {
            font-size: 1rem;
            color: var(--text-secondary);
        }
        .user-id-wrapper {
            background-color: var(--background);
            border-radius: 0.375rem;
            padding: 0.5rem;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 1rem;
            border: 1px solid var(--border);
            text-align: center;
            word-break: break-all;
            max-width: 300px;
            margin: 1rem auto 0;
        }
        .stat-card {
            background: var(--surface-gradient);
            border-radius: 0.75rem; padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }
        .stat-card .header {
            display: flex; align-items: center;
            color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 0.5rem;
        }
        .stat-card i { margin-left: 0.5rem; }
        .stat-card .value {
            font-size: 1.75rem; font-weight: 800; color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .section-header {
            font-size: 1.75rem; font-weight: 800;
            margin-bottom: 1.5rem; color: var(--text-primary);
        }
        .asset-card, .action-btn {
            background: var(--surface-gradient);
            border: 1px solid var(--border);
            border-radius: 0.75rem; padding: 1.5rem;
            text-align: center; transition: all 0.2s ease-in-out;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .asset-card:hover, .action-btn:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-light);
        }
        .asset-card h3 {
            font-size: 1.1rem; font-weight: 700;
            color: var(--text-primary); margin-bottom: 0.5rem;
        }
        .asset-card p {
            font-size: 0.9rem; color: var(--text-secondary);
        }
        .asset-card .value {
            font-weight: 700; margin-top: 1rem;
        }
        .action-btn { cursor: pointer; }
        .action-btn i {
            font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem;
        }
        .action-btn span {
            font-size: 1.25rem; font-weight: 700; display: block;
        }
        .action-btn.logout {
            border-color: var(--danger);
        }
        .action-btn.logout i, .action-btn.logout span {
             color: var(--danger);
        }
        .action-btn.logout:hover {
            background-color: rgba(248, 81, 73, 0.1);
            box-shadow: 0 0 20px rgba(248, 81, 73, 0.2);
        }
        .notification {
            position: fixed; bottom: 1.5rem; left: 1.5rem; z-index: 2000;
            background-color: #1E293B; border-radius: 0.5rem;
            padding: 1rem 1.5rem; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            transform: translateY(calc(100% + 2rem)); transition: transform 0.4s ease-in-out;
            color: white; min-width: 350px; display: flex; align-items: center; gap: 1rem;
            border-top: 3px solid var(--primary);
        }
        .notification.show { transform: translateY(0); }
        .notification i { font-size: 1.25rem; }
        .grid { display: grid; gap: 1.5rem; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); }
        @media (max-width: 1200px) {
            .grid-4 { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="main-content">
        <header class="profile-card">
            <h2 id="profileHeadName">جار التحميل...</h2>
            <p id="profileCountryName">جار التحميل...</p>
            <div class="user-id-wrapper">
                <span id="profileUserId">...</span>
            </div>
        </header>
        
        <section class="grid grid-4 mb-8">
            <div class="stat-card">
                <div class="header"><i class="fas fa-wallet" style="color: var(--warning);"></i> <span>الخزينة العامة</span></div>
                <p id="balance" class="value">...</p>
            </div>
            <div class="stat-card">
                <div class="header"><i class="fas fa-hand-holding-dollar" style="color: var(--success);"></i> <span>الدخل اليومي</span></div>
                <p id="dailyIncome" class="value">...</p>
            </div>
             <div class="stat-card">
                <div class="header"><i class="fas fa-smile" style="color: var(--primary);"></i> <span>معنويات الشعب</span></div>
                <p id="morale" class="value">... %</p>
            </div>
            <div class="stat-card">
                <div class="header"><i class="fas fa-clock" style="color: var(--text-secondary);"></i> <span>الدخل القادم بعد</span></div>
                <p id="incomeTimer" class="value" style="font-size: 1.5rem; letter-spacing: 2px;">...</p>
            </div>
            <div class="stat-card col-span-2">
                <div class="header"><i class="fas fa-fire" style="color: var(--danger);"></i> <span>القوة العسكرية</span></div>
                <p id="militaryPower" class="value">...</p>
            </div>
        </section>

        <section class="mb-8">
            <h2 class="section-header">الأصول الوطنية</h2>
            <div id="ownedAssets" class="grid grid-4">
                <p class="text-secondary col-span-full">لا توجد أصول مسجلة حالياً</p>
            </div>
        </section>
        
        <section class="mb-8">
            <h2 class="section-header">الوصول السريع للمتاجر</h2>
            <div class="grid grid-4">
                <button class="action-btn" onclick="navigateTo('economic_store.html')">
                    <i class="fas fa-landmark"></i> <span>الاستثمارات</span>
                </button>
                <button class="action-btn" onclick="navigateTo('tanks_store.html')">
                    <i class="fa-solid fa-shield-halved"></i> <span>البرية</span>
                </button>
                <button class="action-btn" onclick="navigateTo('aircraft_store.html')">
                    <i class="fas fa-paper-plane"></i> <span>الجوية</span>
                </button>
                <button class="action-btn" onclick="navigateTo('missiles_store.html')">
                    <i class="fas fa-crosshairs"></i> <span>الاستراتيجية</span>
                </button>
            </div>
        </section>

        <section>
            <h2 class="section-header">الإدارة العامة</h2>
            <div class="grid grid-4">
                 <button class="action-btn" onclick="navigateTo('people_management.html')">
                    <i class="fas fa-users"></i> <span>إدارة الشعب</span>
                </button>
                 <button class="action-btn logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> <span>تسجيل الخروج</span>
                </button>
            </div>
        </section>
    </div>

    <div id="notification" class="notification">
        <i id="notificationIcon"></i>
        <p id="notificationMessage"></p>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script>
        function showNotification(message, type = 'info') {
            const el = {
                notification: document.getElementById('notification'),
                msg: document.getElementById('notificationMessage'),
                icon: document.getElementById('notificationIcon')
            };
            if (!el.notification || !el.msg || !el.icon) return;

            const styles = { success: { icon: 'fas fa-check-circle', color: 'var(--success)' }, error: { icon: 'fas fa-times-circle', color: 'var(--danger)' }, info: { icon: 'fas fa-info-circle', color: 'var(--primary)' } };
            const style = styles[type] || styles.info;
            
            el.notification.style.borderTopColor = style.color;
            el.icon.className = `fas ${style.icon}`;
            el.icon.style.color = style.color;
            el.msg.textContent = message;
            el.notification.classList.add('show');

            setTimeout(() => el.notification.classList.remove('show'), 4000);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            const firebaseConfig = {
                apiKey: "AIzaSyDtj_AsssLYm7ZZpgFeUTqYNCrAUevOprs",
                authDomain: "the-chess-game-54a2c.firebaseapp.com",
                databaseURL: "https://the-chess-game-54a2c-default-rtdb.firebaseio.com",
                projectId: "the-chess-game-54a2c",
                storageBucket: "the-chess-game-54a2c.firebasestorage.app",
                messagingSenderId: "1012470944135",
                appId: "1:1012470944135:web:353bd44c8f5f7d8dcdc322"
            };

            try { firebase.initializeApp(firebaseConfig); } catch (e) {
                document.body.innerHTML = `<div style="color: red; text-align: center; margin-top: 50px;">خطأ فادح في تهيئة التطبيق.</div>`;
                return;
            }

            const auth = firebase.auth();
            const firestore = firebase.firestore();
            const database = firebase.database();

            document.getElementById('logoutBtn').addEventListener('click', () => {
                auth.signOut().then(() => { window.location.href = 'index.html'; });
            });
            
            const ASSET_DEFINITIONS = {
                'منجم_الذهب': { value: 9000000, type: 'اقتصادي' }, 'منجم_الماس': { value: 16000000, type: 'اقتصادي' },
                'حقل_النفط': { value: 25000000, type: 'اقتصادي' }, 'محطة_نووية': { value: 120000000, type: 'اقتصادي' },
                'كتيبة_المشاة': { value: 4000, type: 'عسكري' }, 'كتيبة_القناصة': { value: 5500, type: 'عسكري' },
                'كتيبة_الهجومية_الجوية': { value: 12000, type: 'عسكري' }, 'كتيبة_المدرعات': { value: 14000, type: 'عسكري' },
                'كتيبة_النخبة_الخاصة': { value: 25000, type: 'عسكري' }, 'طائرة_مقاتلة': { value: 35000, type: 'عسكري' },
                'طائرة_قاذفة': { value: 60000, type: 'عسكري' }, 'صاروخ_باليستي': { value: 80000, type: 'عسكري' },
                'صاروخ_كروز': { value: 45000, type: 'عسكري' }, 'T-90': { value: 15000, type: 'عسكري' },
                'Abrams': { value: 19000, type: 'عسكري' }, 'Leopard2': { value: 16500, type: 'عسكري' },
                'Merkava': { value: 15500, type: 'عسكري' }, 'Challenger2': { value: 18000, type: 'عسكري' },
            };
            
            let incomeCountdownInterval;
            
            function formatNumber(num) { return num.toLocaleString('en-US'); }

            function startIncomeTimer() {
                if (incomeCountdownInterval) clearInterval(incomeCountdownInterval);

                incomeCountdownInterval = setInterval(() => {
                    const now = new Date();
                    const algeriaTimeOffset = 1; 
                    const nowUTC = now.getTime() + (now.getTimezoneOffset() * 60000);
                    const nowAlgeria = new Date(nowUTC + (3600000 * algeriaTimeOffset));

                    let nextIncomeTime = new Date(nowAlgeria);
                    nextIncomeTime.setHours(12, 0, 0, 0);

                    if (nowAlgeria.getTime() > nextIncomeTime.getTime()) {
                        nextIncomeTime.setDate(nextIncomeTime.getDate() + 1);
                    }
                    
                    const distance = nextIncomeTime - nowAlgeria;
                    
                    const hours = Math.floor(distance / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);
                    
                    document.getElementById('incomeTimer').textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                }, 1000);
            }

            function updateUI(gameData) {
                const { balance = 0, dailyIncome = 0, militaryPower = 0, assets = {}, morale = 75 } = gameData;
                document.getElementById('balance').textContent = `${formatNumber(balance)} $`;
                document.getElementById('dailyIncome').textContent = `${formatNumber(dailyIncome)} $`;
                document.getElementById('militaryPower').textContent = formatNumber(militaryPower);
                document.getElementById('morale').textContent = `${Math.floor(morale)} %`;
                const ownedAssetsDiv = document.getElementById('ownedAssets');
                ownedAssetsDiv.innerHTML = '';
                const ownedAssets = Object.keys(assets);
                if (ownedAssets.length === 0) {
                    ownedAssetsDiv.innerHTML = `<p class="text-secondary col-span-full">لا توجد أصول مسجلة حالياً</p>`;
                    return;
                }
                ownedAssets.forEach(assetName => {
                    const count = assets[assetName];
                    const assetDef = ASSET_DEFINITIONS[assetName];
                    if (assetDef) {
                        let displayValue = '';
                        if (assetDef.type === 'اقتصادي') {
                            displayValue = `<p class="value" style="color: var(--success);">+${formatNumber(assetDef.value * count)} $ / يوم</p>`;
                        } else if (assetDef.type === 'عسكري') {
                            displayValue = `<p class="value" style="color: var(--danger);">${formatNumber(assetDef.value * count)} قوة</p>`;
                        }
                        ownedAssetsDiv.innerHTML += `
                            <div class="asset-card">
                                <h3>${assetName.replace(/_/g, ' ')}</h3>
                                <p>الكمية: ${formatNumber(count)}</p>
                                ${displayValue}
                            </div>`;
                    }
                });
            }

            async function checkAndUpdateDailyIncome(userRef, gameData) {
                const now = new Date();
                const algeriaTimeOffset = 1;
                const nowUTC = now.getTime() + (now.getTimezoneOffset() * 60000);
                const nowAlgeria = new Date(nowUTC + (3600000 * algeriaTimeOffset));
                
                const todayAlgeria = nowAlgeria.toISOString().split('T')[0];
                const lastClaimDate = gameData.lastClaimDate || "1970-01-01";
                
                if (todayAlgeria > lastClaimDate && nowAlgeria.getHours() >= 12) {
                    const income = gameData.dailyIncome || 0;
                    if (income > 0) {
                        const newBalance = (gameData.balance || 0) + income;
                        await userRef.update({ balance: newBalance, lastClaimDate: todayAlgeria });
                        gameData.balance = newBalance;
                        showNotification(`تمت إضافة دخلك اليومي البالغ ${formatNumber(income)} $`, 'success');
                    } else {
                         await userRef.update({ lastClaimDate: todayAlgeria });
                    }
                     gameData.lastClaimDate = todayAlgeria;
                }
                return gameData;
            }

            async function manageMorale(userRef, gameData) {
                const now = new Date().getTime();
                const oneHour = 60 * 60 * 1000;
                const lastMoraleUpdate = gameData.lastMoraleUpdate || now;
                const timePassed = now - lastMoraleUpdate;

                if (timePassed >= oneHour) {
                    const hoursPassed = Math.floor(timePassed / oneHour);
                    let newMorale = (gameData.morale || 75) - hoursPassed; 
                    if (newMorale < 0) newMorale = 0;

                    await userRef.update({
                        morale: newMorale,
                        lastMoraleUpdate: now
                    });
                    gameData.morale = newMorale;
                    gameData.lastMoraleUpdate = now;
                }
                return gameData;
            }

            async function initializeUser(user) {
                const firestoreDocRef = firestore.collection('users').doc(user.uid);
                let firestoreDoc = await firestoreDocRef.get();
                let profileData;

                if (!firestoreDoc.exists || !firestoreDoc.data().headName || !firestoreDoc.data().country) {
                    profileData = { headName: "القائد", country: "الدولة الجديدة" };
                    await firestoreDocRef.set(profileData, { merge: true });
                } else {
                    profileData = firestoreDoc.data();
                }

                document.getElementById('profileHeadName').textContent = profileData.headName;
                document.getElementById('profileCountryName').textContent = profileData.country;
                document.getElementById('profileUserId').textContent = user.uid;

                const rtdbUserRef = database.ref(`users/${user.uid}`);
                let gameDataSnapshot = await rtdbUserRef.get();
                let gameData;

                if (!gameDataSnapshot.exists()) {
                    const initialMorale = Math.floor(Math.random() * (85 - 65 + 1)) + 65; 
                    gameData = { balance: 100000000, assets: {}, dailyIncome: 0, militaryPower: 0, lastClaimDate: "1970-01-01", morale: initialMorale, lastMoraleUpdate: new Date().getTime() };
                    await rtdbUserRef.set(gameData);
                } else {
                    gameData = gameDataSnapshot.val();
                    if (gameData.morale === undefined) {
                        gameData.morale = Math.floor(Math.random() * (85 - 65 + 1)) + 65;
                        gameData.lastMoraleUpdate = new Date().getTime();
                        await rtdbUserRef.update({ morale: gameData.morale, lastMoraleUpdate: gameData.lastMoraleUpdate });
                    }
                }

                gameData = await checkAndUpdateDailyIncome(rtdbUserRef, gameData);
                gameData = await manageMorale(rtdbUserRef, gameData);
                updateUI(gameData);
                startIncomeTimer();
            }
            
            window.navigateTo = (url) => { window.location.href = url; };

            auth.onAuthStateChanged((user) => {
                if (user) {
                    initializeUser(user).catch(error => {
                        showNotification(`حدث خطأ فادح: ${error.message}`, 'error');
                    });
                } else {
                    window.location.href = 'index.html?reason=not_authenticated';
                }
            });
        });
    </script>
</body>
</html>
